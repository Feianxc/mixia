name: 功能建议
description: 想要的新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么问题
      description: 先说场景和痛点，再说方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎么解决
  - type: textarea
    id: security
    attributes:
      label: 对安全边界的影响
      description: 这个功能会不会让服务器、扩展或别的 App 多看到或多做什么？不确定可以留空。
