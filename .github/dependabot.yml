version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: gomod
    directories:
      - /server
      - /apps/desktop/native/hwkey
      - /apps/desktop/native/nmhost
    schedule:
      interval: monthly
  - package-ecosystem: gradle
    directory: /apps/mobile/android
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
